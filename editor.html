<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hot-server · editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@unocss/reset/tailwind.min.css">
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="h-screen overflow-hidden bg-slate-100 font-sans text-sm text-slate-800 antialiased">
  <div
    x-data="editor()"
    x-init="init()"
    @keydown.ctrl.s.prevent="save()"
    @keydown.meta.s.prevent="save()"
    class="flex h-screen"
  >
    <aside class="flex w-64 shrink-0 flex-col border-r border-slate-200 bg-slate-50">
      <div class="flex items-center justify-between border-b border-slate-200 p-3">
        <span class="text-xs font-medium text-slate-500">app/</span>
        <button @click="create()" class="rounded px-1.5 py-0.5 text-xs text-slate-500 hover:bg-slate-200 hover:text-slate-900">新建</button>
      </div>
      <nav class="flex flex-1 flex-col gap-0.5 overflow-auto p-2">
        <template x-for="file in files" :key="file">
          <button
            @click="open(file)"
            x-text="file"
            class="truncate rounded px-2 py-1 text-left font-mono text-xs"
            :class="file === current ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:bg-slate-100'"
          ></button>
        </template>
      </nav>
    </aside>

    <section class="flex min-w-0 flex-1 flex-col bg-white">
      <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white p-3">
        <span class="truncate font-mono text-xs text-slate-400" x-text="current || ''"></span>
        <div class="flex items-center gap-3 text-xs">
          <span x-show="status" x-text="status" class="text-emerald-600"></span>
          <span x-show="error" x-text="error" class="text-red-500"></span>
          <button
            @click="save()"
            :disabled="!current || saving"
            class="rounded bg-emerald-600 px-3 py-1.5 text-white hover:bg-emerald-500 disabled:opacity-50"
            x-text="saving ? '保存中…' : '保存'"
          ></button>
        </div>
      </header>

      <textarea
        x-model="code"
        spellcheck="false"
        class="flex-1 resize-none bg-white p-4 font-mono text-sm leading-6 text-slate-900 !outline-none"
      ></textarea>

      <footer class="border-t border-slate-200 bg-slate-50 p-2 text-xs text-slate-400">Ctrl/⌘ S</footer>
    </section>
  </div>

  <script>
    const encodePath = (path) => path.split("/").map(encodeURIComponent).join("/");

    function editor() {
      return {
        files: [],
        current: "",
        code: "",
        saving: false,
        status: "",
        error: "",
        async init() {
          await this.refresh();
          if (this.files.includes("index.ts")) await this.open("index.ts");
          else if (this.files.length) await this.open(this.files[0]);
        },
        async refresh() {
          try {
            const res = await fetch("/kernel/code");
            if (!res.ok) throw new Error(`列表失败: ${res.status}`);
            this.files = (await res.json()).filter((file) => file.endsWith(".ts")).sort();
          } catch (err) {
            this.error = String(err?.message ?? err);
          }
        },
        async open(file) {
          this.error = "";
          const res = await fetch("/kernel/code/" + encodePath(file));
          if (!res.ok) {
            this.error = `读取失败: ${res.status}`;
            return;
          }
          this.current = file;
          this.code = await res.text();
        },
        async save() {
          if (!this.current) return;
          this.saving = true;
          this.error = "";
          try {
            const res = await fetch("/kernel/code/" + encodePath(this.current), { method: "PUT", body: this.code });
            if (!res.ok) throw new Error(await res.text());
            this.status = `已保存 ${new Date().toLocaleTimeString()}`;
            setTimeout(() => (this.status = ""), 2500);
          } catch (err) {
            this.error = String(err?.message ?? err);
          } finally {
            this.saving = false;
          }
        },
        async create() {
          const name = prompt("新建文件:", "route.ts");
          if (!name) return;
          const res = await fetch("/kernel/code/" + encodePath(name), { method: "PUT", body: "" });
          if (!res.ok) {
            this.error = `新建失败: ${res.status}`;
            return;
          }
          await this.refresh();
          await this.open(name);
        },
      };
    }
  </script>
</body>
</html>
